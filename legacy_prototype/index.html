<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fero Fasya - Links</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Opening Loading Screen with opening.gif (Hanya muncul pertama kali di sesi browser) -->
  <script>
    if (sessionStorage.getItem('fero_visited_session')) {
      document.write('<style>#openingLoader { display: none !important; }</style>');
    }
  </script>
  <div id="openingLoader" class="opening-loader">
    <div class="loader-content">
      <img src="opening.gif" alt="loading..." class="loader-gif">
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- SVG Definition: Reusable Crescent Moon ClipPath (Bulan Sabit) -->
  <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
    <defs>
      <clipPath id="crescentClip" clipPathUnits="objectBoundingBox">
        <!-- Melengkung ke kanan membentuk bulan sabit di sisi kanan tombol -->
        <path d="M 0,0 Q 0.42,0.5 0,1 L 1,1 L 1,0 Z" />
      </clipPath>
    </defs>
  </svg>

  <div class="background-canvas">
    <!-- Main Neumorphic Card Container -->
    <main class="neumorphic-card">

      <!-- Header Area (Nama & Social Icons Dock) -->
      <header class="header">
        <div class="profile-title-container">
          <h1 class="profile-name">fero fasya</h1>
          <div class="gif-wrapper">
            <img src="menhera.gif" alt="menhera" class="profile-gif">
          </div>
        </div>
        
        <!-- Social Icons (Flat / Clean Icons: GitHub, LinkedIn, Instagram, WhatsApp) -->
        <div class="social-dock">
          <!-- GitHub -->
          <a href="https://github.com/FeroFasya" target="_blank" rel="noopener noreferrer" class="social-icon-link" aria-label="GitHub" title="GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </a>

          <!-- LinkedIn -->
          <a href="https://www.linkedin.com/in/ferofasya/" target="_blank" rel="noopener noreferrer" class="social-icon-link" aria-label="LinkedIn" title="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
          </a>

          <!-- Instagram -->
          <a href="https://www.instagram.com/feroowl/" target="_blank" rel="noopener noreferrer" class="social-icon-link" aria-label="Instagram" title="Instagram">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>

          <!-- WhatsApp -->
          <a href="https://wa.me/6285117777993" target="_blank" rel="noopener noreferrer" class="social-icon-link" aria-label="WhatsApp" title="WhatsApp">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
          </a>
        </div>
      </header>

      <!-- Action / Links Section -->
      <section class="links-container">

        <!-- Link 1: web karya -->
        <a href="#" class="neu-link-btn">
          <span class="btn-title">web karya</span>
          <!-- Decorative Watermark Cluster (Clean Monochrome MyWebu Star) -->
          <svg class="btn-watermark-icon" viewBox="0 0 120 120" fill="none" stroke="currentColor">
            <g transform="rotate(8 60 60)" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 60 12 C 60 36 84 60 108 60 C 84 60 60 84 60 108 C 60 84 36 60 12 60 C 36 60 60 36 60 12 Z" stroke-width="7.5"/>
              <line x1="102" y1="18" x2="102" y2="34" stroke-width="7"/>
              <line x1="94" y1="26" x2="110" y2="26" stroke-width="7"/>
              <circle cx="20" cy="94" r="8" stroke-width="6"/>
            </g>
          </svg>
        </a>

        <!-- Link 2: katalog bisnis -->
        <a href="#" class="neu-link-btn">
          <!-- Decorative Watermark Left: Google Developers Chevrons < > Ramping & Glossy Bergantian -->
          <svg class="btn-watermark-left" viewBox="0 0 100 52" fill="none">
            <defs>
              <!-- Kiri: Red (atas) -> Blue (bawah) -->
              <linearGradient id="gdevLeftGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#EA4335" />
                <stop offset="100%" stop-color="#4285F4" />
              </linearGradient>

              <!-- Kanan: Green (atas) -> Yellow (bawah) -->
              <linearGradient id="gdevRightGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#34A853" />
                <stop offset="100%" stop-color="#FBBC05" />
              </linearGradient>
            </defs>

            <!-- LEFT CHEVRON < -->
            <path class="gdev-base" d="M 42 11 L 10 26 L 42 41" stroke="url(#gdevLeftGrad)" />
            <path class="gdev-laser-left" d="M 42 11 L 10 26 L 42 41" stroke="url(#gdevLeftGrad)" />

            <!-- RIGHT CHEVRON > -->
            <path class="gdev-base" d="M 58 11 L 90 26 L 58 41" stroke="url(#gdevRightGrad)" />
            <path class="gdev-laser-right" d="M 58 11 L 90 26 L 58 41" stroke="url(#gdevRightGrad)" />
          </svg>
          <span class="btn-title">katalog bisnis</span>
        </a>

        <!-- Link 3: resume -->
        <a href="#" class="neu-link-btn">
          <span class="btn-title">resume</span>
        </a>

        <!-- Link 4: project aika (With Crescent Thumbnail) -->
        <a href="aika.html" class="neu-link-btn has-crescent-thumb">
          <span class="btn-title">project aika</span>
          <div class="crescent-thumb" title="Thumbnail Placeholder">
            <!-- Placeholder Image Icon -->
            <svg class="thumb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <!-- Subtle Curved Divider Line -->
          <svg class="crescent-divider-svg" viewBox="0 0 90 64" fill="none" preserveAspectRatio="none">
            <path d="M 0 0 Q 38 32 0 64" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
          </svg>
        </a>

        <!-- Link 5: kira ai trainer (With Crescent Thumbnail) -->
        <a href="kira.html" class="neu-link-btn has-crescent-thumb">
          <span class="btn-title">kira ai trainer</span>
          <div class="crescent-thumb" title="Thumbnail Placeholder">
            <!-- Placeholder Image Icon -->
            <svg class="thumb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <!-- Subtle Curved Divider Line -->
          <svg class="crescent-divider-svg" viewBox="0 0 90 64" fill="none" preserveAspectRatio="none">
            <path d="M 0 0 Q 38 32 0 64" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
          </svg>
        </a>
      </section>

      <!-- Section Komentar (Minimalist Clean Terminal Line) -->
      <section class="comment-section">
        <div class="terminal-comment-box">
          <span class="terminal-prompt">$</span>
          <input type="text" id="commentInput" class="terminal-input" placeholder="mau bilang apa ke fero....." maxlength="280" autocomplete="off" />
          <button id="btnSendComment" class="terminal-send-btn" aria-label="Kirim Pesan" title="Kirim">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- Footer Tipis (Fixed nempel di bawah) -->
  <footer class="footer">
    <p class="footer-text">ferooooooooooo :3</p>
  </footer>

  <!-- Floating Draggable Mesin Waktu Icon -->
  <div id="floatingTimeMachine" class="floating-time-machine" role="button" aria-label="Buka Mesin Waktu" title="Mesin Waktu (Klik untuk buka / Tahan untuk geser)">
    <div class="time-machine-pulse"></div>
    <svg class="time-machine-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"></circle>
      <polyline points="12 9 12 13 15 14"></polyline>
      <line x1="12" y1="5" x2="12" y2="2"></line>
      <line x1="10" y1="2" x2="14" y2="2"></line>
      <circle cx="12" cy="13" r="1" fill="currentColor"></circle>
    </svg>
    <span id="floatingBadgeCount" class="time-badge-counter" style="display: none;">0</span>
  </div>

  <!-- Modal Identitas: Nama Kamu Siapa? -->
  <div id="nameModal" class="neu-modal-backdrop" aria-hidden="true">
    <div class="neu-modal-card">
      <button id="btnCloseModal" class="modal-close-btn" aria-label="Tutup">&times;</button>
      
      <h3 class="modal-title">nama kamu siapa?</h3>
      <p class="modal-desc">Biar Fero tahu siapa yang ninggalin jejak waktu ini</p>
      
      <input type="text" id="visitorNameInput" class="neu-input" placeholder="Ketik namamu..." maxlength="30" autocomplete="off" />
      
      <div class="modal-actions">
        <button id="btnAnonymous" class="neu-modal-btn btn-secondary">anonimus aja 🕵️</button>
        <button id="btnConfirmSend" class="neu-modal-btn btn-primary">kirim jejak ✨</button>
      </div>
    </div>
  </div>

  <!-- Toast Notifikasi Sukses -->
  <div id="toastSuccess" class="neu-toast" aria-hidden="true">
    <span>Pesanmu berhasil terkirim ke mesin waktu! ✨</span>
  </div>

  <script src="script.js"></script>
</body>

</html>
